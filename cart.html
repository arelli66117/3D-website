<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RIK X | Shopping Cart</title>

    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

<!-- ================= NAVBAR ================= -->
<header>
    <nav class="navbar">
        <h2 class="logo">RIK X</h2>

        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="products.html">Products</a></li>
            <li><a href="cart.html">Cart 🛒 <span id="cart-count">0</span></a></li>
        </ul>
    </nav>
</header>

<!-- ================= CART SECTION ================= -->
<section class="cart-section">

    <h2 style="text-align:center;color:#ff6600;font-size:40px;margin-bottom:20px;">
        🛒 Your Shopping Cart
    </h2>

    <p style="text-align:center;color:#ccc;margin-bottom:40px;">
        Review your products before checkout.
    </p>

    <!-- Products Display Here -->
    <div id="cart-items"></div>

    <!-- Total Price -->
    <div class="total-box">
        <h2>Total Amount</h2>
        <h1 id="total-price" style="color:#ff6600;">₹0</h1>

        <button onclick="clearCart()" class="checkout-btn" style="background:red; margin-right:10px;">
            🗑 Clear Cart
        </button>

        <a href="checkout.html" class="checkout-btn">
            💳 Proceed to Checkout
        </a>
    </div>

</section>

<!-- ================= FOOTER ================= -->
<footer>
    <h2>RIK X</h2>
    <p>Premium Sneaker & Streetwear Shopping Website.</p>
    <p>Designed by Arelli Rithwik ❤️</p>
    <p>📧 arellirithwik@gmail.com</p>
    <p>© 2026 RIK X. All Rights Reserved.</p>
</footer>

<!-- JavaScript -->
<script src="js/script.js"></script>

</body>
</html>
